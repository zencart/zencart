name: Zen Cart Mutation Tests

# Advisory only: runs Infection (mutation testing) on the lines a pull request changes, within the
# scope listed in infection.json5. It never blocks a merge (continue-on-error). See .ai/rules/testing.md.

on:
  pull_request:
    paths:
      - 'includes/classes/**'
      - 'not_for_release/testFramework/Unit/**'
      - 'infection.json5'
      - 'phpunit.xml'
      - 'composer.json'

jobs:
  infection:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Infection (changed lines, advisory)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: --git-diff-lines diffs against the PR base

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer:v2.9.8

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --ignore-platform-reqs --prefer-dist --no-ansi --no-plugins --no-scripts

      - name: Prepare the application
        run: |
          touch includes/configure.php
          mkdir -p tmp

      - name: Run Infection on the changed lines
        run: |
          vendor/bin/infection --threads=4 --no-progress --show-mutations --only-covering-test-cases \
            --git-diff-lines --git-diff-base="origin/${{ github.base_ref }}" \
            --ignore-msi-with-no-mutations --min-msi=0 --min-covered-msi=0

      - name: Summarise the result
        if: always()
        run: |
          {
            echo '### Mutation testing (changed lines, advisory)'
            echo '```'
            cat tmp/infection/summary.log 2>/dev/null || echo 'No summary was produced (no changed lines in scope, or the run failed).'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Infection reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: infection-report
          path: tmp/infection
          if-no-files-found: ignore
          retention-days: 30
